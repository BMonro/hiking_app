name: hiking_app
description: Hiking trip planning app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  go_router: ^14.0.0

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  geolocator: ^13.0.0

  supabase_flutter: ^2.5.0
  app_links: ^7.0.0

  dio: ^5.4.3

  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  http: ^1.2.2

flutter:
  uses-material-design: true